version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt -r requirements-dev.txt
  build:
    commands:
      - python -m pytest -v --junitxml=reportes/pruebas.xml

reports:
  pruebas-unitarias:
    files:
      - reportes/pruebas.xml
    file-format: JUNITXML

artifacts:
  files:
    - main.py
    - requirements.txt
    - Procfile
    - static/**/*
    - .ebextensions/**/*

cache:
  paths:
    - /root/.cache/pip/**/*
